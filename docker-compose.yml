version: '3.8'

services:
  guardia-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardia_ai_platform
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
    volumes:
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
